<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青岛旅行攻略</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#eef2f7;--card:rgba(255,255,255,.72);--card-h:rgba(255,255,255,.9);--bd:rgba(0,0,0,.06);--txt:#1a202c;--dim:#5a6a8a;--c1:#06b6d4;--c2:#8b5cf6;--c3:#f59e0b;--c4:#10b981;--c5:#ec4899;--sh:0 6px 24px rgba(0,0,0,.06);--glow1:0 0 20px rgba(6,182,212,.08);--glow2:0 0 20px rgba(139,92,246,.08)}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;overflow-x:hidden;min-height:100vh}/* Loader */.loader{position:fixed;inset:0;background:#eef2f7;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s,visibility .6s}.loader.hide{opacity:0;visibility:hidden}.loader-wave{width:120px;height:40px;display:flex;align-items:center;justify-content:center;gap:4px}.loader-wave span{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--c1),var(--c2));animation:lw 1.2s ease-in-out infinite}.loader-wave span:nth-child(1){animation-delay:0s;height:12px}.loader-wave span:nth-child(2){animation-delay:.1s;height:24px}.loader-wave span:nth-child(3){animation-delay:.2s;height:32px}.loader-wave span:nth-child(4){animation-delay:.3s;height:24px}.loader-wave span:nth-child(5){animation-delay:.4s;height:12px}@keyframes lw{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.5)}}.loader-text{font-size:.8em;font-weight:700;color:var(--dim);letter-spacing:3px;text-transform:uppercase;animation:fadePulse 1.5s ease-in-out infinite}@keyframes fadePulse{0%,100%{opacity:.4}50%{opacity:1}}/* Aurora */.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden}.aurora::before,.aurora::after,.aurora div{content:'';position:absolute;border-radius:50%;filter:blur(120px);opacity:.15;animation:drift 30s ease-in-out infinite}.aurora::before{width:550px;height:550px;background:var(--c1);top:-180px;left:-100px}.aurora::after{width:650px;height:650px;background:var(--c2);bottom:-220px;right:-140px;animation-delay:-15s}.aurora div{width:450px;height:450px;background:var(--c5);top:35%;left:35%;animation-delay:-8s;opacity:.06}@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(100px,-80px) scale(1.2)}66%{transform:translate(-60px,100px) scale(.8)}}.grid-bg{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(6,182,212,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.025) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.particles span{position:absolute;border-radius:50%;animation:rise linear infinite}@keyframes rise{from{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(-10vh) translateX(50px);opacity:0}}.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));box-shadow:0 0 16px var(--c1);transition:width .1s}/* Sticky nav */.sticky-nav{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);width:100%;max-width:680px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;z-index:90;background:rgba(238,242,247,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);transition:transform .4s cubic-bezier(.4,0,.2,1)}.sticky-nav.show{transform:translateX(-50%) translateY(0)}.sn-title{font-size:.76em;font-weight:800;display:flex;align-items:center;gap:6px}.sn-days{display:flex;gap:4px}.sn-day{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--dim);font-size:.58em;font-weight:700;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}.sn-day:hover{color:var(--txt);border-color:var(--c1)}.sn-day.active{color:#fff}.sn-day[data-d="1"].active{background:linear-gradient(135deg,#f59e0b,#ea580c);border-color:transparent}.sn-day[data-d="2"].active{background:linear-gradient(135deg,#0ea5e9,#0369a1);border-color:transparent}.sn-day[data-d="3"].active{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent}.sn-day[data-d="4"].active{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}.sn-theme{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:.8em;display:flex;align-items:center;justify-content:center;transition:all .3s}.sn-theme:hover{border-color:var(--c3);transform:rotate(20deg)}.app{max-width:680px;margin:0 auto;padding:12px;position:relative}/* Wave */.wave{display:block;width:100%;height:40px;margin:6px 0;opacity:.3}/* Hero */.hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:8px;box-shadow:var(--sh)}.hero-bg{width:100%;height:280px;object-fit:cover;display:block;transition:transform .5s ease-out;will-change:transform}.hero-glow{position:absolute;inset:0;background:linear-gradient(135deg,rgba(6,182,212,.2),rgba(139,92,246,.15),rgba(245,158,11,.08));mix-blend-mode:overlay;pointer-events:none}.hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(4,6,15,.95) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:26px 28px}.hero-badge{position:absolute;top:16px;right:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:20px;padding:5px 18px;font-size:.64em;font-weight:800;box-shadow:0 4px 24px rgba(6,182,212,.4);animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 4px 24px rgba(6,182,212,.4)}50%{box-shadow:0 4px 32px rgba(139,92,246,.5)}}.hero h1{font-size:1.75em;font-weight:900;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.7);letter-spacing:1px}.hero h1 .cursor-blink{display:inline-block;width:3px;height:1em;background:var(--c1);animation:blink .8s steps(2) infinite;vertical-align:text-bottom;margin-left:2px}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.hero-sub{font-size:.76em;color:rgba(255,255,255,.8);margin-top:4px;animation:slideUp .8s .8s both}.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;animation:slideUp .8s 1s both}.hero-tags span{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:.6em;color:#fff;transition:all .3s}.hero-tags span:hover{transform:translateY(-3px) scale(1.1);background:rgba(255,255,255,.25);box-shadow:0 4px 16px rgba(0,0,0,.2)}@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}.grad-text{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% 200%;animation:gradShift 4s ease-in-out infinite}@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}.sec-label{font-size:.6em;font-weight:800;text-transform:uppercase;letter-spacing:2.5px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}.sec-label .sec-dot{width:6px;height:6px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px var(--c1)}/* Info cards */.info-row{display:flex;gap:8px;margin-bottom:8px}.info-card{flex:1;border-radius:14px;padding:12px 14px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);transition:all .35s;position:relative;overflow:hidden}.info-card::after{content:'';position:absolute;inset:-1px;border-radius:14px;padding:1px;background:linear-gradient(135deg,transparent,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s}.info-card:hover{transform:translateY(-4px) perspective(600px) rotateX(2deg);box-shadow:var(--sh)}.info-card:hover::after{opacity:1;background:linear-gradient(135deg,var(--c1),var(--c2),transparent)}.info-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}.info-card.t-go::before{background:linear-gradient(90deg,var(--c1),transparent)}.info-card.t-back::before{background:linear-gradient(90deg,var(--c2),transparent)}.info-card.stay::before{background:linear-gradient(90deg,var(--c3),transparent)}.ic-label{font-size:.52em;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}.ic-route{font-size:.8em;font-weight:700;margin:3px 0 1px}.ic-price{font-size:1.25em;font-weight:900;color:var(--c1)}.info-card.t-back .ic-price{color:var(--c2)}.info-card.stay .ic-price{color:var(--c3);font-size:.82em}.ic-detail{font-size:.54em;color:var(--dim);margin-top:2px}/* Trip flow */.trip-flow{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:16px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);margin-bottom:16px;position:relative;overflow:hidden}.trip-flow::before{content:'';position:absolute;left:12%;right:12%;top:50%;height:2px;background:linear-gradient(90deg,var(--c3),var(--c1),var(--c2),var(--c4));opacity:.25}.trip-flow::after{content:'';position:absolute;left:12%;top:50%;height:2px;background:linear-gradient(90deg,var(--c3),var(--c1));transition:width .5s ease;box-shadow:0 0 8px var(--c1);opacity:.6}.tf-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .35s;flex:1}.tf-node:hover{transform:translateY(-4px)}.tf-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1em;transition:all .4s cubic-bezier(.34,1.56,.64,1);border:2px solid var(--bd);background:var(--bg)}.tf-node[data-d="1"] .tf-dot{border-color:var(--c3);background:rgba(245,158,11,.08)}.tf-node[data-d="2"] .tf-dot{border-color:var(--c1);background:rgba(6,182,212,.08)}.tf-node[data-d="3"] .tf-dot{border-color:var(--c2);background:rgba(139,92,246,.08)}.tf-node[data-d="4"] .tf-dot{border-color:var(--c4);background:rgba(16,185,129,.08)}.tf-node.active .tf-dot{transform:scale(1.25)}.tf-node[data-d="1"].active .tf-dot{box-shadow:0 0 0 4px rgba(245,158,11,.15),0 0 20px var(--c3)}.tf-node[data-d="2"].active .tf-dot{box-shadow:0 0 0 4px rgba(6,182,212,.15),0 0 20px var(--c1)}.tf-node[data-d="3"].active .tf-dot{box-shadow:0 0 0 4px rgba(139,92,246,.15),0 0 20px var(--c2)}.tf-node[data-d="4"].active .tf-dot{box-shadow:0 0 0 4px rgba(16,185,129,.15),0 0 20px var(--c4)}.tf-label{font-size:.54em;font-weight:700;color:var(--dim);text-align:center;transition:color .3s}.tf-node.active .tf-label{color:var(--txt)}/* Day header */.day-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:14px 16px;border-radius:16px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);position:relative;overflow:hidden}.day-hdr::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px}.day-hdr.d1::before{background:linear-gradient(180deg,var(--c3),var(--c5))}.day-hdr.d2::before{background:linear-gradient(180deg,var(--c1),var(--c2))}.day-hdr.d3::before{background:linear-gradient(180deg,var(--c2),var(--c5))}.day-hdr.d4::before{background:linear-gradient(180deg,var(--c4),var(--c1))}.dh-icon{font-size:2em;filter:drop-shadow(0 0 12px rgba(6,182,212,.3));animation:iconFloat 3s ease-in-out infinite}@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.dh-text{flex:1}.dh-title{font-size:.92em;font-weight:800}.dh-sub{font-size:.62em;color:var(--dim)}.dh-stats{display:flex;gap:8px}.dh-stat{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--bd)}.dh-stat strong{font-size:1.15em;color:var(--c1);font-weight:900}.dh-stat label{font-size:.52em;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}/* Day progress */.day-prog{height:3px;border-radius:2px;background:var(--bd);margin-bottom:14px;overflow:hidden}.day-prog-bar{height:100%;border-radius:2px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}.day-prog-bar.d1{background:linear-gradient(90deg,var(--c3),var(--c5))}.day-prog-bar.d2{background:linear-gradient(90deg,var(--c1),var(--c2))}.day-prog-bar.d3{background:linear-gradient(90deg,var(--c2),var(--c5))}.day-prog-bar.d4{background:linear-gradient(90deg,var(--c4),var(--c1))}/* Activity grid */.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.act-card{border-radius:12px;padding:11px 13px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}.act-card::before{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(6,182,212,.06),transparent);opacity:0;transition:opacity .35s}.act-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--sh);background:var(--card-h);border-color:rgba(6,182,212,.25)}.act-card:hover::before{opacity:1}.act-card.train{border-left:3px solid var(--c2)}.act-card.sunrise{border-left:3px solid var(--c3)}.act-card.rest{border-left:3px solid var(--c4)}.act-card.food{border-left:3px solid var(--c5)}.act-time{font-size:.6em;font-weight:700;color:var(--c1);background:rgba(6,182,212,.08);padding:1px 7px;border-radius:5px;display:inline-block;margin-bottom:4px}.act-card.train .act-time{color:var(--c2);background:rgba(139,92,246,.08)}.act-card.sunrise .act-time{color:var(--c3);background:rgba(245,158,11,.08)}.act-card.rest .act-time{color:var(--c4);background:rgba(16,185,129,.08)}.act-card.food .act-time{color:var(--c5);background:rgba(236,72,153,.08)}.act-spot{font-size:.76em;font-weight:700;line-height:1.3}.act-desc{font-size:.58em;color:var(--dim);line-height:1.4;margin-top:3px}.act-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.act-transport{font-size:.56em;color:var(--dim)}.act-budget{font-size:.64em;font-weight:800;color:var(--c4)}.act-budget.free{color:var(--c4);opacity:.5}.act-card.full{grid-column:span 2}/* Day images */.day-imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scroll-snap-type:x mandatory}.day-imgs::-webkit-scrollbar{height:3px}.day-imgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}.day-imgs img{width:175px;height:110px;object-fit:cover;border-radius:12px;flex-shrink:0;scroll-snap-align:start;transition:all .35s;border:1px solid var(--bd)}.day-imgs img:hover{transform:scale(1.1);box-shadow:var(--sh);border-color:var(--c1)}/* Food */.food-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}.food-row::-webkit-scrollbar{height:3px}.food-row::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}.food-mini{flex:1;min-width:100px;border-radius:12px;padding:12px 8px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);text-align:center;transition:all .35s}.food-mini:hover{transform:translateY(-4px) scale(1.03);border-color:var(--c5);box-shadow:0 4px 20px rgba(236,72,153,.15)}.food-mini .fe{font-size:1.8em;margin-bottom:4px;transition:transform .35s}.food-mini:hover .fe{transform:scale(1.2) rotate(-5deg)}.food-mini .fn{font-size:.66em;font-weight:700}.food-mini .fd{font-size:.5em;color:var(--dim);margin-top:2px}/* Alert */.alert-box{border-radius:16px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,rgba(59,130,246,.05),rgba(139,92,246,.05));border:1px solid rgba(59,130,246,.1);backdrop-filter:blur(12px);font-size:.72em;line-height:1.7;position:relative;overflow:hidden}.alert-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:li
